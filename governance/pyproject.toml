[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edagov"
version = "0.1.0"
description = "EDA/KiCad evidence governance: inventory, authorized ERC/DRC/ngspice runs, BOM and release manifests, gates, audit, review dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only (combined work; edagov originally MIT, see LICENSE-MIT-edagov)"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
edagov = "edagov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
