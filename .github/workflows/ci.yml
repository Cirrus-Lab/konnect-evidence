name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      # Fast, named contract gate for the adopted outcome catalogue and the
      # reviewed legacy-debt ratchet. The full test step below remains the
      # regression gate; this makes contract drift immediately identifiable.
      - name: Reliability contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p konnect-core --locked reliability_contract -- --nocapture
      - name: Test (unit + integration)
        run: cargo test --workspace --locked --lib --tests
      # --doc cannot be combined with --lib/--tests; doctests broke silently
      # once (PR #49) because they were never run in CI.
      - name: Doctests
        run: cargo test --workspace --locked --doc

  # The KiCAD action plugin is Python, so cargo never sees it. Its only real
  # logic is the server-PID bookkeeping (#103), where an unconditional
  # os.remove let one KiCAD session delete another's record and leak an
  # unreapable server. The tests stub pcbnew/wx, so no KiCAD is needed.
  plugin:
    name: Plugin (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test
        run: python -m unittest discover -s plugin/tests -v

  # Konnect-Evidence: the edagov governance toolkit (Python) that the Rust
  # dispatch hook talks to. Its tests include the change-window protocol the
  # bridge relies on (`edagov konnect authorize|record --format kv`) and the
  # stdio MCP server.
  governance:
    name: Governance (Python)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Test
        working-directory: governance
        run: python -m pytest -q
      - name: Secret scan
        run: python governance/bin/edagov.py scan-secrets governance/src skills docs

  # The pytest suite drives POSIX shell launchers and fake tools; on Windows,
  # smoke-test the cross-platform `.py` launcher and the decision protocol
  # the Rust bridge parses.
  governance-windows:
    name: Governance (Windows smoke)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Change-window round trip
        shell: pwsh
        run: |
          $E = "governance/bin/edagov.py"
          $D = Join-Path $env:RUNNER_TEMP "design"
          Copy-Item -Recurse governance/examples/buck-demo/kicad (Join-Path $D "kicad")
          $env:EDAGOV_ACTOR = "designer@example.com"
          python $E --root $D init --product P --design D --board B --revision A --grant designer@example.com=contributor --grant reviewer@example.com=design_reviewer
          $sch = Join-Path $D "kicad/buck-demo.kicad_sch"
          $deny = python $E --root $D konnect authorize --tool add_wire --toolset sch_wiring --effect design_write --call-id W1 --path $sch --format kv
          if (-not ($deny -match "^decision=deny")) { throw "expected deny: $deny" }
          $req = python $E --root $D konnect window request --scope sch_wiring --reason "windows smoke"
          $id = ([regex]::Match(($req -join "`n"), "id=(WIN-[A-Z0-9]+)")).Groups[1].Value
          $env:EDAGOV_ACTOR = "reviewer@example.com"
          python $E --root $D konnect window approve $id
          $env:EDAGOV_ACTOR = "designer@example.com"
          $allow = python $E --root $D konnect authorize --tool add_wire --toolset sch_wiring --effect design_write --call-id W2 --path $sch --format kv
          if (-not ($allow -match "^decision=allow")) { throw "expected allow: $allow" }
          python $E --root $D konnect ledger --verify
          python $E --root $D audit verify

  # flake.nix pins its own toolchain, dependency set and build flags, so
  # nothing else in CI would notice it going stale — and it names things
  # that move: `-p konnect --bin konnect`, rust-toolchain.toml, and a
  # preCheck that supplies KONNECT_STATE_DIR for the tests that need a
  # writable state dir. Without this job it is broken-on-arrival the first
  # time any of those changes, and only Nix users find out.
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check flake metadata
        run: nix flake check --no-build
      - name: Build the package
        run: nix build .#konnect --print-build-logs

  # schematic-viewer is intentionally outside the workspace (Tauri app), so
  # --workspace never touches it. Without this job a viewer break ships
  # silently: release builds it with continue-on-error and the PCM scripts
  # omit a missing viewer binary without failing.
  viewer:
    name: Schematic viewer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: viewer
          workspaces: crates/schematic-viewer
      - name: Check
        run: cargo check --locked --manifest-path crates/schematic-viewer/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path crates/schematic-viewer/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests, benches and examples are linted too. Without it
      # test code is never checked, and it had accumulated real findings: eight
      # `MutexGuard` held across an await, a dropped coordinate that left half
      # of a transform assertion unwritten, and a handful of style lints (#121).
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # Dependency license gate (deny.toml). Dual licensing (AGPL + commercial)
  # means every dependency must be acceptable under BOTH — this job stops an
  # incompatible license entering via an innocuous-looking dependency bump.
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  packaging:
    name: PCM packaging validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate repository metadata
        run: python packaging/validate-pcm.py --metadata packaging/metadata.json

      # Stub binaries carry each platform's executable magic: the validator
      # checks a package's bundled binary against the platform it declares,
      # which is what stops a Windows-only zip from being offered to every OS.
      - name: Assemble Windows PCM zip with a stub binary and validate structure
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("stub-konnect.exe", [byte[]](0x4D, 0x5A, 0x90, 0x00))
          ./packaging/build-pcm.ps1 -Version 0.0.0 -BinaryPath stub-konnect.exe `
            -Platform windows -OutDir dist
          python packaging/validate-pcm.py --zip dist/konnect-pcm-v0.0.0-windows.zip

      # build-pcm.sh is what the macOS and Linux release packages are built
      # with, so it gets the same structural check.
      - name: Assemble Linux PCM zip with a stub binary and validate structure
        run: |
          set -euo pipefail
          printf '\177ELF\002\001\001\000' > stub-konnect
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-konnect \
            --platform linux --out dist
          python packaging/validate-pcm.py --zip dist/konnect-pcm-v0.0.0-linux.zip

      - name: Reject a package whose binary contradicts its platform
        run: |
          set -euo pipefail
          # The exact mistake v0.1.3 shipped: a Windows binary in a package
          # non-Windows users are offered. The gate must fail here.
          printf 'MZ\220\000' > stub-konnect-win
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-konnect-win \
            --platform linux --out dist-bad
          if python packaging/validate-pcm.py --zip dist-bad/konnect-pcm-v0.0.0-linux.zip; then
            echo "::error::validator accepted a Windows binary in a linux package"
            exit 1
          fi
          echo "OK: mismatched binary/platform correctly rejected"
